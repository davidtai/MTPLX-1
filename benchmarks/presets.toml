[preset.hy3-oq2e-rq4-88r]
description = "Fix candidate 'r' (re-derived limit) for the T4 envelope-admission anomaly: hy3-oq2e-rq4-88 REJECTs at every swept KV level (own fixed footprint over-books its declared 95 GiB limit by a constant 0.629 GiB, per NOTES.md T4 + evals/tier2/oq2e_rq4_88_16k.json). This preset keeps islands=79 (true full residency preserved, unlike the 'f' fallback) and re-derives memory-limit from the admission harness's own fixed_bytes at this exact config (islands 79, proj-requant q4, splitk router, kv=4096 control): fixed_bytes = 102,681,301,504 B = 95.629 GiB. + a family-healthy margin (0.371 GiB, inside the family's observed 0.19-1.00 GiB healthy band, e.g. -32's 0.32 GiB), rounded up to a clean GiB -> memory-limit = 96 GiB. Precedent note: the 96-envelope champion receipt (hy3-oq2e-rq4-96, same islands-79 full residency; evals/tier2/NOTES.md line 132) measured 91.9 GiB ACTUAL hard peak at its natural ~2048 live-token shape; scaling that peak by the KV delta from 2048 to 16384 ((16384-2048)*327,680 B/tok = +4.375 GiB, i.e. +~4.4 GiB) projects an ACTUAL peak of ~96.3 GiB at 16k -- comfortably under the ~99.75 GiB admission KNOB this preset implies at 16k (96 GiB + (16384-4096)*327,680 B KV-override = +3.75 GiB), confirming the knob has ~3.5 GiB of real headroom above the projected actual working set, not just a paper margin. CPU-admission-validated (research/envelope_admission_sweep.py's evaluate_admission()) at 4096/16384/32768/65536; ADMIT at all four with a constant ~0.371 GiB fits_fixed margin (mirrors -88's constant-REJECT signature, now on the ADMIT side)."
extends = "hy3-oq2e-rq4-88"
memory-limit = "96GiB"

[preset.hy3-oq2e-rq4-88r.env]
MTPLX_SUSTAINED_PREFILL = "1"
