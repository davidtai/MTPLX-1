<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">Qwen3.8 native MTP decode throughput across four fixed and adaptive lanes</title>
  <desc id="desc">Grouped bar chart at 100, 1024, 16384, 65536, and 131072 prompt tokens. Historical PR 335 fixed K3 values are 107.58, 59.33, 54.57, 42.04, and 34.01 tokens per second. Current fixed K3 values are 117.93, 65.38, 53.44, 40.46, and 32.70. Adaptive BF16 values are 114.78, 63.47, 51.60, 40.40, and 31.78. Adaptive Q4 values are 118.53, 62.85, 56.01, 44.77, and 37.61.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#070b12"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1400" height="800" rx="24" fill="url(#background)"/>

  <text x="80" y="58" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="750">
    Qwen3.8 native MTP decode throughput
  </text>
  <text x="80" y="91" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="17">
    Historical PR #335 fixed K3 vs current MLX/Metal 0.32.2 lanes
  </text>

  <g transform="translate(270 118)" font-family="Inter, system-ui, sans-serif" font-size="14">
    <rect x="0" y="0" width="22" height="15" rx="3" fill="#94a3b8"/>
    <text x="30" y="13" fill="#cbd5e1">PR #335 fixed K3</text>
    <rect x="190" y="0" width="22" height="15" rx="3" fill="#60a5fa"/>
    <text x="220" y="13" fill="#cbd5e1">Current fixed K3</text>
    <rect x="390" y="0" width="22" height="15" rx="3" fill="#fbbf24"/>
    <text x="420" y="13" fill="#cbd5e1">Adaptive BF16</text>
    <rect x="560" y="0" width="22" height="15" rx="3" fill="#34d399"/>
    <text x="590" y="13" fill="#cbd5e1">Adaptive Q4</text>
  </g>

  <!-- Plot grid: 0 to 125 decode tok/s. -->
  <g stroke="#334155" stroke-width="1">
    <line x1="90" y1="140" x2="1360" y2="140" opacity="0.55"/>
    <line x1="90" y1="242" x2="1360" y2="242" opacity="0.45"/>
    <line x1="90" y1="344" x2="1360" y2="344" opacity="0.45"/>
    <line x1="90" y1="446" x2="1360" y2="446" opacity="0.45"/>
    <line x1="90" y1="548" x2="1360" y2="548" opacity="0.45"/>
    <line x1="90" y1="650" x2="1360" y2="650" opacity="0.8"/>
  </g>
  <g fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" text-anchor="end">
    <text x="78" y="145">125</text>
    <text x="78" y="247">100</text>
    <text x="78" y="349">75</text>
    <text x="78" y="451">50</text>
    <text x="78" y="553">25</text>
    <text x="78" y="655">0</text>
  </g>
  <text x="34" y="392" transform="rotate(-90 34 392)" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="16" text-anchor="middle">
    Decode tokens per second
  </text>

  <!-- 100 tokens. -->
  <g filter="url(#shadow)">
    <rect x="110" y="211.07" width="44" height="438.93" rx="6" fill="#94a3b8"/>
    <rect x="162" y="168.84" width="44" height="481.16" rx="6" fill="#60a5fa"/>
    <rect x="214" y="181.69" width="44" height="468.31" rx="6" fill="#fbbf24"/>
    <rect x="266" y="166.40" width="44" height="483.60" rx="6" fill="#34d399"/>
  </g>
  <g fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" text-anchor="middle">
    <text x="132" y="199">107.58</text>
    <text x="184" y="157">117.93</text>
    <text x="236" y="170">114.78</text>
    <text x="288" y="155">118.53</text>
  </g>

  <!-- 1,024 tokens. -->
  <g filter="url(#shadow)">
    <rect x="360" y="407.93" width="44" height="242.07" rx="6" fill="#94a3b8"/>
    <rect x="412" y="383.24" width="44" height="266.76" rx="6" fill="#60a5fa"/>
    <rect x="464" y="391.04" width="44" height="258.96" rx="6" fill="#fbbf24"/>
    <rect x="516" y="393.57" width="44" height="256.43" rx="6" fill="#34d399"/>
  </g>
  <g fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" text-anchor="middle">
    <text x="382" y="396">59.33</text>
    <text x="434" y="371">65.38</text>
    <text x="486" y="379">63.47</text>
    <text x="538" y="382">62.85</text>
  </g>

  <!-- 16,384 tokens. -->
  <g filter="url(#shadow)">
    <rect x="610" y="427.35" width="44" height="222.65" rx="6" fill="#94a3b8"/>
    <rect x="662" y="431.94" width="44" height="218.06" rx="6" fill="#60a5fa"/>
    <rect x="714" y="439.46" width="44" height="210.54" rx="6" fill="#fbbf24"/>
    <rect x="766" y="421.48" width="44" height="228.52" rx="6" fill="#34d399"/>
  </g>
  <g fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" text-anchor="middle">
    <text x="632" y="415">54.57</text>
    <text x="684" y="420">53.44</text>
    <text x="736" y="427">51.60</text>
    <text x="788" y="409">56.01</text>
  </g>

  <!-- 65,536 tokens. -->
  <g filter="url(#shadow)">
    <rect x="860" y="478.48" width="44" height="171.52" rx="6" fill="#94a3b8"/>
    <rect x="912" y="484.92" width="44" height="165.08" rx="6" fill="#60a5fa"/>
    <rect x="964" y="485.16" width="44" height="164.84" rx="6" fill="#fbbf24"/>
    <rect x="1016" y="467.34" width="44" height="182.66" rx="6" fill="#34d399"/>
  </g>
  <g fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" text-anchor="middle">
    <text x="882" y="466">42.04</text>
    <text x="934" y="473">40.46</text>
    <text x="986" y="473">40.40</text>
    <text x="1038" y="455">44.77</text>
  </g>

  <!-- 131,072 tokens. -->
  <g filter="url(#shadow)">
    <rect x="1110" y="511.24" width="44" height="138.76" rx="6" fill="#94a3b8"/>
    <rect x="1162" y="516.58" width="44" height="133.42" rx="6" fill="#60a5fa"/>
    <rect x="1214" y="520.34" width="44" height="129.66" rx="6" fill="#fbbf24"/>
    <rect x="1266" y="496.55" width="44" height="153.45" rx="6" fill="#34d399"/>
  </g>
  <g fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" text-anchor="middle">
    <text x="1132" y="499">34.01</text>
    <text x="1184" y="505">32.70</text>
    <text x="1236" y="508">31.78</text>
    <text x="1288" y="484">37.61</text>
  </g>

  <g fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="650" text-anchor="middle">
    <text x="210" y="688">100</text>
    <text x="460" y="688">1,024</text>
    <text x="710" y="688">16,384</text>
    <text x="960" y="688">65,536</text>
    <text x="1210" y="688">131,072</text>
  </g>
  <g fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle">
    <text x="210" y="710">prompt tokens</text>
    <text x="460" y="710">prompt tokens</text>
    <text x="710" y="710">prompt tokens</text>
    <text x="960" y="710">prompt tokens</text>
    <text x="1210" y="710">prompt tokens</text>
  </g>

  <text x="700" y="730" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle">
    Raw receipt means; every bar is decode tokens per second from the table in this PR.
  </text>
  <text x="700" y="758" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle">
    DFlash2 xhigh is a separate 1K-only failure reference: 25.55 decode tok/s, 642.484 s wall.
  </text>
</svg>
