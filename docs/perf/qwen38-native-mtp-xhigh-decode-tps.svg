<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">Qwen3.8 native MTP xhigh decode throughput</title>
  <desc id="desc">Grouped bar chart for exact 16384-token xhigh output at 1024, 16384, 65536, and 131072 prompt tokens. Current fixed K3 values are 49.73, 45.01, 35.58, and 27.00 tokens per second. Adaptive BF16 values are 49.62, 44.63, 34.30, and 28.37. Adaptive Q4 values are 51.30, 47.59, 36.33, and 29.04. DFlash2 was run only at 1024 prompt tokens and reached 25.55 tokens per second.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#070b12"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1400" height="800" rx="24" fill="url(#background)"/>

  <text x="80" y="58" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="750">
    Qwen3.8 native MTP xhigh decode throughput
  </text>
  <text x="80" y="91" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="17">
    1,024-token conditioner + exact 16,384-token output · MLX/Metal 0.32.2
  </text>

  <g transform="translate(250 118)" font-family="Inter, system-ui, sans-serif" font-size="14">
    <rect x="0" y="0" width="22" height="15" rx="3" fill="#60a5fa"/>
    <text x="30" y="13" fill="#cbd5e1">Current fixed K3</text>
    <rect x="200" y="0" width="22" height="15" rx="3" fill="#fbbf24"/>
    <text x="230" y="13" fill="#cbd5e1">Adaptive BF16</text>
    <rect x="380" y="0" width="22" height="15" rx="3" fill="#34d399"/>
    <text x="410" y="13" fill="#cbd5e1">Adaptive Q4</text>
    <rect x="540" y="0" width="22" height="15" rx="3" fill="#fb7185"/>
    <text x="570" y="13" fill="#cbd5e1">DFlash2 (1K only)</text>
  </g>

  <!-- Plot grid: 0 to 55 decode tok/s. -->
  <g stroke="#334155" stroke-width="1">
    <line x1="90" y1="204.55" x2="1360" y2="204.55" opacity="0.45"/>
    <line x1="90" y1="293.64" x2="1360" y2="293.64" opacity="0.45"/>
    <line x1="90" y1="382.73" x2="1360" y2="382.73" opacity="0.45"/>
    <line x1="90" y1="471.82" x2="1360" y2="471.82" opacity="0.45"/>
    <line x1="90" y1="560.91" x2="1360" y2="560.91" opacity="0.45"/>
    <line x1="90" y1="650" x2="1360" y2="650" opacity="0.8"/>
  </g>
  <g fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" text-anchor="end">
    <text x="78" y="209">50</text>
    <text x="78" y="298">40</text>
    <text x="78" y="387">30</text>
    <text x="78" y="476">20</text>
    <text x="78" y="565">10</text>
    <text x="78" y="655">0</text>
  </g>
  <text x="34" y="405" transform="rotate(-90 34 405)" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="16" text-anchor="middle">
    Decode tokens per second
  </text>

  <!-- 1,024 prompt tokens. -->
  <g filter="url(#shadow)">
    <rect data-series="current_fixed_k3" data-prompt-tokens="1024" data-value="49.73" x="116" y="206.95" width="48" height="443.05" rx="6" fill="#60a5fa"/>
    <rect data-series="current_adaptive_bf16" data-prompt-tokens="1024" data-value="49.62" x="176" y="207.93" width="48" height="442.07" rx="6" fill="#fbbf24"/>
    <rect data-series="current_adaptive_q4" data-prompt-tokens="1024" data-value="51.30" x="236" y="192.96" width="48" height="457.04" rx="6" fill="#34d399"/>
    <rect data-series="dflash2" data-prompt-tokens="1024" data-value="25.55" x="296" y="422.35" width="48" height="227.65" rx="6" fill="#fb7185"/>
  </g>
  <g fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" text-anchor="middle">
    <text x="140" y="195">49.73</text>
    <text x="200" y="196">49.62</text>
    <text x="260" y="181">51.30</text>
    <text x="320" y="410">25.55</text>
  </g>

  <!-- 16,384 prompt tokens. -->
  <g filter="url(#shadow)">
    <rect data-series="current_fixed_k3" data-prompt-tokens="16384" data-value="45.01" x="436" y="249.02" width="48" height="400.98" rx="6" fill="#60a5fa"/>
    <rect data-series="current_adaptive_bf16" data-prompt-tokens="16384" data-value="44.63" x="496" y="252.39" width="48" height="397.61" rx="6" fill="#fbbf24"/>
    <rect data-series="current_adaptive_q4" data-prompt-tokens="16384" data-value="47.59" x="556" y="226.02" width="48" height="423.98" rx="6" fill="#34d399"/>
  </g>
  <g fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" text-anchor="middle">
    <text x="460" y="237">45.01</text>
    <text x="520" y="240">44.63</text>
    <text x="580" y="214">47.59</text>
    <text x="640" y="636" fill="#64748b">—</text>
  </g>

  <!-- 65,536 prompt tokens. -->
  <g filter="url(#shadow)">
    <rect data-series="current_fixed_k3" data-prompt-tokens="65536" data-value="35.58" x="756" y="333.02" width="48" height="316.98" rx="6" fill="#60a5fa"/>
    <rect data-series="current_adaptive_bf16" data-prompt-tokens="65536" data-value="34.30" x="816" y="344.44" width="48" height="305.56" rx="6" fill="#fbbf24"/>
    <rect data-series="current_adaptive_q4" data-prompt-tokens="65536" data-value="36.33" x="876" y="326.34" width="48" height="323.66" rx="6" fill="#34d399"/>
  </g>
  <g fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" text-anchor="middle">
    <text x="780" y="321">35.58</text>
    <text x="840" y="332">34.30</text>
    <text x="900" y="314">36.33</text>
    <text x="960" y="636" fill="#64748b">—</text>
  </g>

  <!-- 131,072 prompt tokens. -->
  <g filter="url(#shadow)">
    <rect data-series="current_fixed_k3" data-prompt-tokens="131072" data-value="27.00" x="1076" y="409.45" width="48" height="240.55" rx="6" fill="#60a5fa"/>
    <rect data-series="current_adaptive_bf16" data-prompt-tokens="131072" data-value="28.37" x="1136" y="397.25" width="48" height="252.75" rx="6" fill="#fbbf24"/>
    <rect data-series="current_adaptive_q4" data-prompt-tokens="131072" data-value="29.04" x="1196" y="391.28" width="48" height="258.72" rx="6" fill="#34d399"/>
  </g>
  <g fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" text-anchor="middle">
    <text x="1100" y="397">27.00</text>
    <text x="1160" y="385">28.37</text>
    <text x="1220" y="379">29.04</text>
    <text x="1280" y="636" fill="#64748b">—</text>
  </g>

  <g fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="650" text-anchor="middle">
    <text x="230" y="688">1,024</text>
    <text x="550" y="688">16,384</text>
    <text x="870" y="688">65,536</text>
    <text x="1190" y="688">131,072</text>
  </g>
  <g fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle">
    <text x="230" y="710">prompt tokens</text>
    <text x="550" y="710">prompt tokens</text>
    <text x="870" y="710">prompt tokens</text>
    <text x="1190" y="710">prompt tokens</text>
  </g>

  <text x="700" y="740" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="14" text-anchor="middle">
    Raw receipt means; 128K is one pass per candidate. Higher decode throughput is better.
  </text>
  <text x="700" y="765" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle">
    DFlash2 was measured only at 1K; dashes mean not run, not zero throughput.
  </text>
</svg>
