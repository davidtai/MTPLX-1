<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">Qwen3.8 27B Native MTP versus DFlash2 decode throughput</title>
  <desc id="desc">Grouped bar chart comparing Native MTP and DFlash2 decode tokens per second at prompt lengths 100, 1024, 16384, 65536, and 131072 tokens. Native MTP values are 107.58, 59.33, 54.57, 42.04, and 34.01. DFlash2 values are 113.25, 73.36, 64.99, 49.64, and 39.60.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#070b12"/>
    </linearGradient>
    <linearGradient id="mtp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8b6d8"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="dflash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ee9ad"/>
      <stop offset="1" stop-color="#16a66a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1400" height="800" rx="24" fill="url(#background)"/>

  <text x="80" y="62" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="750">
    Qwen3.8 27B decode throughput
  </text>
  <text x="80" y="96" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="17">
    Native MTP vs DFlash2 across prompt context lengths
  </text>

  <g transform="translate(1010 44)" font-family="Inter, system-ui, sans-serif" font-size="16">
    <rect x="0" y="0" width="24" height="16" rx="4" fill="url(#mtp)"/>
    <text x="34" y="14" fill="#cbd5e1">Native MTP</text>
    <rect x="150" y="0" width="24" height="16" rx="4" fill="url(#dflash)"/>
    <text x="184" y="14" fill="#cbd5e1">DFlash2</text>
  </g>

  <!-- Plot grid: 0 to 120 decode tok/s. -->
  <g stroke="#334155" stroke-width="1">
    <line x1="120" y1="140" x2="1320" y2="140" opacity="0.55"/>
    <line x1="120" y1="220" x2="1320" y2="220" opacity="0.45"/>
    <line x1="120" y1="300" x2="1320" y2="300" opacity="0.45"/>
    <line x1="120" y1="380" x2="1320" y2="380" opacity="0.45"/>
    <line x1="120" y1="460" x2="1320" y2="460" opacity="0.45"/>
    <line x1="120" y1="540" x2="1320" y2="540" opacity="0.45"/>
    <line x1="120" y1="620" x2="1320" y2="620" opacity="0.8"/>
  </g>

  <g fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" text-anchor="end">
    <text x="105" y="145">120</text>
    <text x="105" y="225">100</text>
    <text x="105" y="305">80</text>
    <text x="105" y="385">60</text>
    <text x="105" y="465">40</text>
    <text x="105" y="545">20</text>
    <text x="105" y="625">0</text>
  </g>
  <text x="34" y="385" transform="rotate(-90 34 385)" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="16" text-anchor="middle">
    Decode tokens per second
  </text>

  <!-- 100 tokens: Native 107.58, DFlash2 113.25. -->
  <g filter="url(#shadow)">
    <rect x="150" y="189.68" width="62" height="430.32" rx="7" fill="url(#mtp)"/>
    <rect x="228" y="167" width="62" height="453" rx="7" fill="url(#dflash)"/>
  </g>
  <g fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" text-anchor="middle">
    <text x="181" y="178">107.58</text>
    <text x="259" y="155">113.25</text>
  </g>

  <!-- 1,024 tokens: mean of additional ABBA #1 and #2. -->
  <g filter="url(#shadow)">
    <rect x="390" y="382.68" width="62" height="237.32" rx="7" fill="url(#mtp)"/>
    <rect x="468" y="326.56" width="62" height="293.44" rx="7" fill="url(#dflash)"/>
  </g>
  <g fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" text-anchor="middle">
    <text x="421" y="371">59.33</text>
    <text x="499" y="315">73.36</text>
  </g>

  <!-- 16,384 tokens: Native 54.57, DFlash2 64.99. -->
  <g filter="url(#shadow)">
    <rect x="630" y="401.72" width="62" height="218.28" rx="7" fill="url(#mtp)"/>
    <rect x="708" y="360.04" width="62" height="259.96" rx="7" fill="url(#dflash)"/>
  </g>
  <g fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" text-anchor="middle">
    <text x="661" y="390">54.57</text>
    <text x="739" y="348">64.99</text>
  </g>

  <!-- 65,536 tokens: Native 42.04, DFlash2 49.64. -->
  <g filter="url(#shadow)">
    <rect x="870" y="451.84" width="62" height="168.16" rx="7" fill="url(#mtp)"/>
    <rect x="948" y="421.44" width="62" height="198.56" rx="7" fill="url(#dflash)"/>
  </g>
  <g fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" text-anchor="middle">
    <text x="901" y="440">42.04</text>
    <text x="979" y="410">49.64</text>
  </g>

  <!-- 131,072 tokens: Native 34.01, DFlash2 39.60. -->
  <g filter="url(#shadow)">
    <rect x="1110" y="483.96" width="62" height="136.04" rx="7" fill="url(#mtp)"/>
    <rect x="1188" y="461.60" width="62" height="158.40" rx="7" fill="url(#dflash)"/>
  </g>
  <g fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" text-anchor="middle">
    <text x="1141" y="472">34.01</text>
    <text x="1219" y="450">39.60</text>
  </g>

  <g fill="#e2e8f0" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="650" text-anchor="middle">
    <text x="220" y="658">100</text>
    <text x="460" y="658">1,024</text>
    <text x="700" y="658">16,384</text>
    <text x="940" y="658">65,536</text>
    <text x="1180" y="658">131,072</text>
  </g>
  <g fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle">
    <text x="220" y="681">prompt tokens</text>
    <text x="460" y="681">mean of ABBA #1 + #2</text>
    <text x="700" y="681">prompt tokens</text>
    <text x="940" y="681">prompt tokens</text>
    <text x="1180" y="681">prompt tokens</text>
  </g>

  <g fill="#5ee9ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" text-anchor="middle">
    <text x="220" y="718">+5.27%</text>
    <text x="460" y="718">+23.65%</text>
    <text x="700" y="718">+19.09%</text>
    <text x="940" y="718">+18.09%</text>
    <text x="1180" y="718">+16.46%</text>
  </g>
  <text x="700" y="758" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle">
    DFlash2 decode improvement shown beneath each context pair
  </text>
</svg>
